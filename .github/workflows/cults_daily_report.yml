name: Cults3D Daily Report

on:
  # Triggered exclusively via external precision schedulers (Google Cloud Scheduler & cron-job.org)
  # GitHub Actions internal schedule disabled to eliminate delayed queue ghost runs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send Daily Report
        env:
          CULTS_API_KEY: ${{ secrets.CULTS_API_KEY }}
          CULTS_USERNAME: ${{ secrets.CULTS_USERNAME }}
          DISCORD_WEBHOOK_SALE: ${{ secrets.DISCORD_WEBHOOK_SALE }}
          DISCORD_WEBHOOK_REPORT: ${{ secrets.DISCORD_WEBHOOK_REPORT }}
          DISCORD_WEBHOOK_MESSAGE: ${{ secrets.DISCORD_WEBHOOK_MESSAGE }}
        run: |
          python cults_discord_bot.py --daily-report

      - name: Commit & Push Updated State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cults_bot_state.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update daily report sent state" && git push) || true
