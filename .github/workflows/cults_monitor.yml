name: Cults3D Sales & Comments Monitor

on:
  schedule:
    # Runs every 30 minutes at :15 and :45 past the hour
    - cron: '15,45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cults3D Monitor (Sales + Comments + Fail-safe Daily Report)
        env:
          CULTS_API_KEY: ${{ secrets.CULTS_API_KEY }}
          CULTS_USERNAME: ${{ secrets.CULTS_USERNAME }}
          DISCORD_WEBHOOK_SALE: ${{ secrets.DISCORD_WEBHOOK_SALE }}
          DISCORD_WEBHOOK_REPORT: ${{ secrets.DISCORD_WEBHOOK_REPORT }}
          DISCORD_WEBHOOK_MESSAGE: ${{ secrets.DISCORD_WEBHOOK_MESSAGE }}
        run: |
          python cults_discord_bot.py --monitor

      - name: Commit & Push Updated State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cults_bot_state.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update cults3d tracker state" && git push) || true
